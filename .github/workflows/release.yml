name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # The binaries are published first. The image follows only if they
  # succeeded, so a failed release never leaves a container image behind
  # claiming a version that has no corresponding download.
  goreleaser:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Verify the tagged commit
        run: |
          go vet ./...
          go test -race ./...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker Push
    runs-on: ubuntu-latest
    needs: [goreleaser]
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        env:
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          version="${REF_NAME#v}"

          # Container registries reject uppercase in image names, and this
          # repository's owner has uppercase letters, so github.repository
          # cannot be used verbatim.
          image="ghcr.io/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"

          tags="$image:$version"

          # A pre-release (v1.2.0-rc.1) must not become :latest, or anyone
          # pulling the default tag silently gets a release candidate.
          case "$version" in
            *-*) echo "pre-release $version: not tagging latest" ;;
            *)   tags="$tags,$image:latest" ;;
          esac

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "Image tags: $tags"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # amd64 only, matching what CI already builds and verifies. The
          # release ships arm64 binaries, so a multi-arch image is a sensible
          # follow-up; it needs buildx plus TARGETOS/TARGETARCH handling in
          # the Dockerfile, which is more than this change should carry.
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.head_commit.timestamp }}
